<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" role="img" aria-labelledby="title desc">
  <title id="title">There’s no thinking without writing</title>
  <desc id="desc">A cream and olive editorial cover for Harsehaj’s essay.</desc>
  <rect width="800" height="1100" fill="#f5efdf"/>
  <rect x="48" y="48" width="704" height="1004" rx="22" fill="none" stroke="#4d5a38" stroke-width="3"/>
  <g fill="#4d5a38">
    <rect x="82" y="84" width="60" height="60" rx="14"/>
    <text x="112" y="127" fill="#f5efdf" font-family="Georgia, serif" font-size="40" font-weight="700" text-anchor="middle">h</text>
    <text x="82" y="212" font-family="Arial, Helvetica, sans-serif" font-size="22" letter-spacing="3">INTROSPECTION FT. HARSEHAJ</text>
    <text x="82" y="394" font-family="Georgia, serif" font-size="78" font-weight="400">
      <tspan x="82" dy="0">there’s no</tspan>
      <tspan x="82" dy="94">thinking</tspan>
      <tspan x="82" dy="94">without</tspan>
      <tspan x="82" dy="94">writing</tspan>
    </text>
    <path d="M82 806h636" stroke="#4d5a38" stroke-width="3"/>
    <text x="82" y="872" font-family="Arial, Helvetica, sans-serif" font-size="24" letter-spacing="1.5">WRITING IS THINKING.</text>
    <text x="82" y="982" font-family="Arial, Helvetica, sans-serif" font-size="20" letter-spacing="2">HARSEHAJ · 2024</text>
  </g>
</svg>
